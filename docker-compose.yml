services:

  # ── DIVA Call Transcriptor ────────────────────────────────────────────────
  diva:
    image: diva-transcriptor:latest   # built with: docker build -t diva-transcriptor:latest .
    container_name: diva-transcriptor
    ports:
      - "8521:8522"
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8522/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

